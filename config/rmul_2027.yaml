# foray_navigation · 哨兵 / 2027 赛季 3V3 场地的覆盖层
#
# 只写「跟 shared.yaml 不一样」的项；没写的沿用 shared。

# 车体半径（规划余量）。2026-11-10 主人给的**真实车体尺寸：593 × 593 × 243 mm**。
#   - 内切半径（半宽）= 296.5 mm → 这是下限，比它小就等于让车贴着墙走；
#   - 外接半径 = 419 mm → 想「原地转圈也不碰」得用这个，但那样 0.8 m 宽的隧道就过不去。
# 取 0.32：半宽 296.5 mm + 约 23 mm 余量。十组任务实测 10/10 到达、总里程 89.37 m
# （0.25 时 88.69、0.35 时 108.05、0.42 时 9/10 —— 0.35 以上过隧道要绕大圈）。
engine.robot_radius: 0.32

# 车高 243 mm，隧道净高 250 mm —— **只剩 7 mm**。这条在配置里管不着，但是实车通过隧道的前提：
# 悬架下沉、装甲/云台装配误差、地胶厚度任何一项超过 7 mm，就钻不过去。
# 若实测车高超 250 mm，应把区域表里的隧道删掉（当墙处理），否则规划器会骗人。

# 哨兵不上高地（队内决定，见 decision.md 2026-10-27），
# 中央高地把战场切成两条走廊，因此更倾向于「沿走廊直走」而不是绕行——
# 捷径化打开，偏好权重保持 shared 的 0.5（隧道优先）。
astar.smooth: true

# 单次任务预算：场地 12 m × 8 m、0.025 m/格（约 480 × 320 格），
# 展开上限留足余量即可；20 Hz 下真正卡住的是时间，不是次数。
astar.max_expansions: 200000
